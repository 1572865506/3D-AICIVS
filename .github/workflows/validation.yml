name: correctness-and-regression
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_audit*.py tests/test_validator_agent.py tests/test_domain_constraint_agent.py tests/test_api_frontend_agent.py tests/test_server_error_classification.py -q
      - run: node --test frontend/tests/*.test.cjs
      - run: python tests/regression_guard.py
